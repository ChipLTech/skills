# SKILLHUB.yaml — SkillHub Agent Skills manifest
# mattpocock/skills: Skills for real engineers, organized by category.

skills:
  # ── Engineering ───────────────────────────────────────────────────────

  - name: ask-matt
    description: "Ask which skill or flow fits your situation; a router over the skills in this repo"
    path: skills/engineering/ask-matt
    files:
      - SKILL.md
      - PHASE-BOUNDARIES.md
      - "agents/"

  - name: chipltech-context
    description: "Route Chipltech tasks with cited engineering knowledge."
    path: skills/engineering/chipltech-context
    files:
      - SKILL.md
      - "agents/"

  - name: codebase-design
    description: "Shared vocabulary for designing deep modules. Use when the user wants to design or improve a module's interface, find deepening opportunities, decide where a seam goes, make code more testable or AI-navigable, or when another skill needs the deep-module vocabulary."
    path: skills/engineering/codebase-design
    files:
      - SKILL.md
      - DEEPENING.md
      - DESIGN-IT-TWICE.md
      - "agents/"

  - name: domain-modeling
    description: "Build and sharpen a project's domain model. Use when the user wants to pin down domain terminology or a ubiquitous language, record an architectural decision, or when another skill needs to maintain the domain model."
    path: skills/engineering/domain-modeling
    files:
      - SKILL.md
      - ADR-FORMAT.md
      - CONTEXT-FORMAT.md
      - "agents/"

  - name: diagnosing-bugs
    description: "Diagnosis loop for hard bugs and performance regressions; use when diagnosing or debugging broken, failing, or slow behavior"
    path: skills/engineering/diagnosing-bugs
    files:
      - SKILL.md
      - "agents/"
      - "references/"
      - "scripts/"

  - name: technical-issue-summary
    description: "Compress a closed technical diagnosis into a one- or two-sentence Sprint update, Issue title or summary, owner note, or evidence-linked handoff conclusion. Use when the user asks to summarize, briefly introduce, or explain a diagnosed technical issue across teams."
    path: skills/engineering/technical-issue-summary
    files:
      - SKILL.md
      - "agents/"

  - name: dlc-env-setup
    description: "Rebuild and verify a workstation DLC toolchain, PyTorch 2.5.0 wheel, and optional local vLLM runtime after rediscovering repo locations and checking git safety. Use when the user needs to bootstrap or repair a local DLC development environment, switch rebuild branches safely, or rerun PyTorch or vLLM install validation."
    path: skills/engineering/dlc-env-setup
    files:
      - SKILL.md
      - "agents/"
      - "scripts/"

  - name: dlc-hardware-observability
    description: "Observe Real DLC Hardware with the official cltech_smi and normalized query-only evidence; use when model serving, image qualification, PD, environment repair, or debugging needs device, HBM, process, link, or cleanup snapshots without performing maintenance."
    path: skills/engineering/dlc-hardware-observability
    files:
      - SKILL.md
      - "agents/"
      - "references/"
      - "scripts/"

  - name: model-adaptation
    description: "Adapt a specific new or incompatible model for loading or serving on the DLC Platform; use for model-level Attention, MLA, MoE, quantization, multimodal, MTP, or distributed compatibility, not upstream alignment, environment rebuilds, single-operator debugging, independent compile work, or running an existing smoke alone."
    path: skills/engineering/model-adaptation
    files:
      - SKILL.md
      - "agents/"
      - knowledge.md

  - name: modelzoo-image-validation
    description: "Qualify a local model from an ordinary daily base, use ModelZoo as optional read-only reference, then build independent DLC Chip and TYD Chip deliverables only after functional and benchmark gates pass. Use for ModelZoo-to-image workflows, local-model runtime qualification, or DLC/TYD image export."
    path: skills/engineering/modelzoo-image-validation
    files:
      - SKILL.md
      - "agents/"
      - "references/"
      - "scripts/"

  - name: pd-separation
    description: "Deploy or diagnose vLLM-DLC Prefill/Decode separation with MooncakeDLCConnector; use for single-node TCP, qualified lyp_full or dlccl_direct, cross-machine TCP, transport qualification, KV-transfer lifecycle, routing, and recovery."
    path: skills/engineering/pd-separation
    files:
      - SKILL.md
      - "agents/"
      - "references/"

  - name: main-to-main-upgrade
    description: "Upgrade vllm-dlc main toward an exact upstream vLLM full SHA, recover an unknown Verified vLLM Alignment candidate, or perform complete compatibility-impact analysis; do not use for standalone model adaptation, environment rebuild, single-operator diagnosis, independent compile work, release branch management, or smoke-only requests."
    path: skills/engineering/main-to-main-upgrade
    files:
      - SKILL.md
      - "agents/"
      - knowledge.md

  - name: grill-with-docs
    description: "A relentless interview to sharpen a plan or design, which also creates docs (ADR's and glossary) as we go."
    path: skills/engineering/grill-with-docs
    files:
      - SKILL.md
      - "agents/"

  - name: triage
    description: "Triage issues through a state machine of triage roles"
    path: skills/engineering/triage
    files:
      - SKILL.md
      - "AGENT-BRIEF.md"
      - "OUT-OF-SCOPE.md"
      - "agents/"

  - name: improve-codebase-architecture
    description: "Scan a codebase for deepening opportunities, present them as a visual HTML report, then grill through whichever one you pick."
    path: skills/engineering/improve-codebase-architecture
    files:
      - SKILL.md
      - "HTML-REPORT.md"
      - "agents/"

  - name: setup-matt-pocock-skills
    description: "Scaffold the per-repo config issue tracker, triage label vocabulary, and domain doc layout that the other engineering skills consume"
    path: skills/engineering/setup-matt-pocock-skills
    files:
      - SKILL.md
      - "agents/"
      - "domain.md"
      - "issue-tracker-github.md"
      - "issue-tracker-gitlab.md"
      - "issue-tracker-local.md"
      - "triage-labels.md"

  - name: tdd
    description: "Test-driven development. Use when the user wants to build features or fix bugs test-first, mentions red-green-refactor, or wants integration tests."
    path: skills/engineering/tdd
    files:
      - SKILL.md
      - "mocking.md"
      - "tests.md"
      - "agents/"

  - name: to-spec
    description: "Turn the current conversation into a spec and publish it to the project issue tracker without an additional interview"
    path: skills/engineering/to-spec
    files:
      - SKILL.md
      - "agents/"

  - name: to-tickets
    description: "Break a plan, spec, or conversation into tracer-bullet tickets with explicit blocking edges and publish them to the configured tracker"
    path: skills/engineering/to-tickets
    files:
      - SKILL.md
      - "agents/"

  - name: wayfinder
    description: "Plan work too large for one agent session as a shared map of decision tickets and resolve them until the route is clear"
    path: skills/engineering/wayfinder
    files:
      - SKILL.md
      - "agents/"

  - name: wizard
    description: "Generate an interactive bash wizard that walks a human through steps only they can perform. Use when provisioning infrastructure, setting up credentials or CI secrets, walking an unfamiliar third-party dashboard, or running a one-off migration or cutover. Don't invoke this for steps the agent can perform itself."
    path: skills/engineering/wizard
    files:
      - SKILL.md
      - template.sh
      - "agents/"

  - name: implement
    description: "Implement a piece of work based on a spec or set of tickets"
    path: skills/engineering/implement
    files:
      - SKILL.md
      - "agents/"

  - name: research
    description: "Investigate a question against high-trust primary sources and capture cited findings as a Markdown file in the repo"
    path: skills/engineering/research
    files:
      - SKILL.md
      - "agents/"

  - name: code-review
    description: "Review changes since a fixed point against repository standards and the originating spec using parallel sub-agents"
    path: skills/engineering/code-review
    files:
      - SKILL.md
      - "agents/"

  - name: resolving-merge-conflicts
    description: "Resolve an in-progress git merge or rebase conflict while preserving the intent of both changes where possible"
    path: skills/engineering/resolving-merge-conflicts
    files:
      - SKILL.md
      - "agents/"

  - name: zoom-out
    description: "Tell the agent to zoom out and give broader context or a higher-level perspective on an unfamiliar section of code"
    path: skills/engineering/zoom-out
    files:
      - SKILL.md
      - "agents/"

  - name: prototype
    description: "Build a throwaway prototype to answer a design question. Use when the user wants to sanity-check whether a state model or logic feels right, or explore what a UI should look like."
    path: skills/engineering/prototype
    files:
      - SKILL.md
      - "LOGIC.md"
      - "UI.md"
      - "agents/"

  # ── Productivity ──────────────────────────────────────────────────────

  - name: caveman
    description: "Ultra-compressed communication mode that cuts token usage by dropping filler while keeping full technical accuracy"
    path: skills/productivity/caveman
    files:
      - SKILL.md
      - "agents/"

  - name: grill-me
    description: "A relentless interview to sharpen a plan or design."
    path: skills/productivity/grill-me
    files:
      - SKILL.md
      - "agents/"

  - name: grilling
    description: "Grill the user relentlessly about a plan, decision, or idea. Use when the user wants to stress-test their thinking, or uses any 'grill' trigger phrases."
    path: skills/productivity/grilling
    files:
      - SKILL.md
      - "agents/"

  - name: handoff
    description: "Compact the current conversation into a handoff document so another agent can continue the work"
    path: skills/productivity/handoff
    files:
      - SKILL.md
      - "agents/"

  - name: teach
    description: "Teach the user a new skill or concept within a stateful teaching workspace"
    path: skills/productivity/teach
    files:
      - SKILL.md
      - "agents/"
      - "GLOSSARY-FORMAT.md"
      - "LEARNING-RECORD-FORMAT.md"
      - "MISSION-FORMAT.md"
      - "RESOURCES-FORMAT.md"

  - name: to-questionnaire
    description: "Turn a decision you can't fully answer into a questionnaire for someone else to fill in."
    path: skills/productivity/to-questionnaire
    files:
      - SKILL.md
      - "agents/"

  - name: wait-what
    description: "Stop. That last message did not land — re-pitch it."
    path: skills/productivity/wait-what
    files:
      - SKILL.md
      - "agents/"

  - name: writing-for-agents
    description: "Writing documents for agents. Use when creating or editing skills, or modifying AGENTS.md or CLAUDE.md."
    path: skills/productivity/writing-for-agents
    files:
      - SKILL.md
      - SKILL-MECHANICS.md
      - "agents/"

  # ── Misc ──────────────────────────────────────────────────────────────

  - name: git-guardrails-claude-code
    description: "Set up Claude Code hooks to block dangerous git commands such as push, reset --hard, and clean before they execute"
    path: skills/misc/git-guardrails-claude-code
